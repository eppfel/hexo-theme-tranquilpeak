author:
    # Your biography in english (Markdown and HTML supported)
    bio: "I am a transdisciplinary design researcher at the [Department of Design at Aalto University](https://www.aalto.fi/en/people/felix-epp) and the [Social Computing Group at the University of Helsinki](https://www.helsinki.fi/en/researchgroups/social-computing), working at the intersection of HCI, futures studies, and the political dimensions of digital technologies. My work is defined by methodological agility and innovation — moving between psychological, social-scientific, and artistic approaches across domains as varied as web and UX design, automotive interfaces, dress culture, and digital politics. I am particularly interested in how sociotechnical imaginaries and ideologies shape the technologies we live with, and in developing new methods to bring anticipatory and critical perspectives into design and technology innovation. Find my publications on [Google Scholar](https://scholar.google.com/citations?user=BkhScR8AAAAJ&sortby=pubdate)."
    # Your job in english
    job: "Postdoctoral Researcher"
